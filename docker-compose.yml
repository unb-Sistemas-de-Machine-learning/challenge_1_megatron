services:
  app:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    volumes:
      - banco:/home/app/banco
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  banco:
  ollama:
