name: Ingestão da base

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ingestao-base
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingere:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests==2.34.2
      - name: Ingerir do PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          PYTHONPATH: src
        run: python scripts/ingere_pubmed.py
      - name: Commitar base atualizada
        run: |
          if [ -z "$(git status --porcelain dados/base)" ]; then
            echo "Base sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/base
          git commit -m "chore(dados): atualiza base do PubMed ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
