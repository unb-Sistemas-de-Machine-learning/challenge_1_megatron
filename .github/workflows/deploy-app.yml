name: Deploy App

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -m "not rede" -q
      - name: Publicar no Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publica_space.py "${{ vars.HF_SPACE }}"
